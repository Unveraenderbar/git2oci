---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git2oci
  labels:
    app: git2oci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git2oci
  template:
    metadata:
      annotations:
#        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }' # ensure Istio sidecar is up before main container is stared
        sidecar.istio.io/inject: 'false'
#        sidecar.istio.io/proxyCPU: '0m'
#        sidecar.istio.io/proxyMemory: '0Mi'
#        sidecar.istio.io/proxyCPULimit: '1'
#        sidecar.istio.io/rewriteAppHTTPProbers: "true"
        io.kubernetes.cri-o.userns-mode: 'auto:size=65536;keep-id=true'
      labels:
        app: git2oci
    spec:
      containers:
      - command: ['/usr/bin/python3', '/data/git2oci-server.py']
        env:
        - name: GIT2OCI_TARGET_REGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: flux-system
              key: registrytoken
        - name: GIT2OCI_TARGET_REGISTRY_USERNAME
          valueFrom:
            secretKeyRef:
              name: flux-system
              key: username
        - name: GIT2OCI_TOKEN
          valueFrom:
            secretKeyRef:
              name: 'flux-system'
              key: 'token'
        - name: HTTP_PROXY
        - name: HTTPS_PROXY
        - name: http_proxy
        - name: https_proxy
        envFrom:
        - configMapRef:
            name: git2oci
        image: docker.io/alpine/k8s:1.37.2
        imagePullPolicy: Always
        name: git2oci
        ports:
        - containerPort: 8000
          protocol: TCP
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 3
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - mountPath: /data/git2oci-server.py
          name: git2oci
          readOnly: true
          subPath: git2oci-server.py
      serviceAccount: kustomize-controller
      volumes:
      - name: git2oci
        configMap:
          name: git2oci

---
kind: Service
apiVersion: v1
metadata:
  name: git2oci
  labels:
    app: git2oci
spec:
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
  selector:
    app: git2oci
