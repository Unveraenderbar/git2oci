---
apiVersion: builtin
kind: ValueAddTransformer
metadata:
  name: flux-rbac-dirname-adder

# Omitting the 'value' field means that the current kustomization root directory name will be used as the value.
# value:  not specified!

targets:
- fieldPath: metadata/namespace
- fieldPath: metadata/annotations/git2oci-target-cluster # to be reduced to cluster name by succeeding trafo
