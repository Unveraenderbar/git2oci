---
apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: git2oci-flux-provider
replacements:
- source:
    kind: Provider
    name: git2oci
    fieldPath: metadata.namespace # value is expected to be set by prior transformation!
  targets:
  - select:
      kind: Provider
      name: git2oci
    fieldPaths:
    - spec.address
    options:
      delimiter: '.'
      index: 1

- source:
    kind: Provider
    name: git2oci
    fieldPath: metadata.namespace # value is expected to be set by prior transformation!
    options:
      delimiter: '-'
      index: 0
  targets:
  - select:
      kind: Deployment
      name: git2oci
    fieldPaths:
    - metadata.annotations.git2oci-target-cluster
    - spec.template.metadata.annotations.git2oci-target-cluster
    options:
      create: true

- source:
    kind: ConfigMap
    name: git2oci
    fieldPath: data.GIT2OCI_IMAGE
  targets:
  - select:
      kind: Deployment
      name: git2oci
    fieldPaths:
    - spec.template.spec.containers.[name=git2oci].image

- source:
    kind: ConfigMap
    name: git2oci
    fieldPath: data.GIT2OCI_IMAGE_REGISTRY
  targets:
  - select:
      kind: Deployment
      name: git2oci
    fieldPaths:
    - spec.template.spec.containers.[name=git2oci].image
    options:
      delimiter: '/'
      index: -1

